<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="title">2048</div>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">分数</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box best">
                    <div class="score-label">最高分</div>
                    <div class="score-value" id="best-score">0</div>
                </div>
            </div>
        </header>
        <div class="controls">
            <button id="new-game" class="btn btn-primary">新游戏</button>
            <button id="undo" class="btn btn-secondary">撤销</button>
        </div>
        <div class="game-board" id="game-board">
            <div class="grid-container">
                <div class="grid-cell" data-row="0" data-col="0"></div>
                <div class="grid-cell" data-row="0" data-col="1"></div>
                <div class="grid-cell" data-row="0" data-col="2"></div>
                <div class="grid-cell" data-row="0" data-col="3"></div>
                <div class="grid-cell" data-row="1" data-col="0"></div>
                <div class="grid-cell" data-row="1" data-col="1"></div>
                <div class="grid-cell" data-row="1" data-col="2"></div>
                <div class="grid-cell" data-row="1" data-col="3"></div>
                <div class="grid-cell" data-row="2" data-col="0"></div>
                <div class="grid-cell" data-row="2" data-col="1"></div>
                <div class="grid-cell" data-row="2" data-col="2"></div>
                <div class="grid-cell" data-row="2" data-col="3"></div>
                <div class="grid-cell" data-row="3" data-col="0"></div>
                <div class="grid-cell" data-row="3" data-col="1"></div>
                <div class="grid-cell" data-row="3" data-col="2"></div>
                <div class="grid-cell" data-row="3" data-col="3"></div>
            </div>
            <div class="tiles-container" id="tiles-container"></div>
        </div>
        <div class="hint-area">
            <p class="hint-title">操作提示</p>
            <div class="hint-content">
                <div class="key-hints">
                    <span class="key">↑</span>
                    <span class="key">←</span>
                    <span class="key">↓</span>
                    <span class="key">→</span>
                    <span class="hint-text">键盘方向键控制</span>
                </div>
                <div class="swipe-hints">
                    <span class="hint-text">或使用鼠标/触摸屏滑动</span>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="game-over-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">游戏结束</div>
            <div class="modal-score">
                <span>最终得分: </span>
                <span id="final-score">0</span>
            </div>
            <div class="modal-buttons">
                <button id="restart-game" class="btn btn-primary">再来一局</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="win-modal" style="display: none;">
        <div class="modal-content win">
            <div class="modal-title">🎉 恭喜！</div>
            <div class="modal-subtitle">你达到了 2048！</div>
            <div class="modal-score">
                <span>当前得分: </span>
                <span id="win-score">0</span>
            </div>
            <div class="modal-buttons">
                <button id="continue-game" class="btn btn-primary">继续游戏</button>
                <button id="restart-after-win" class="btn btn-secondary">重新开始</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
